<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Shop</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <div class="topbar" style="border-radius: 14px;">
      <div class="logo"><a href="home.html"> EcoShop </a></div>
      <div class="topbar-links">
        <a href="shop.html" class="Shop-link">Shop</a>
        <a href="Collection.html" class="Collection-link">Collection</a>
        <a href="profile.html" class="profile-icon" title="Profile">
          <img src="logo.jpg" alt="Profile" />
        </a>
      </div>
    </div>

    <div class="container" style="margin-top: 10px;">
      <!-- Search Bar -->
      <div class="search-bar">
        <input type="text" placeholder="Search" />
      </div>

      <!-- Category Icons -->
      <div class="categories">
        <div class="category">
          🔥
          <p>Popular</p>
        </div>
        <div class="category">
          ⭐
          <p>New</p>
        </div>
        <div class="category">
          💸
          <p>Discount 25%</p>
        </div>
        <div class="category">
          👍
          <p>Recommendation</p>
        </div>
      </div>

      <!-- Banners -->
      <div class="banner">
        <img src="img.1.jpg" alt="Eco Save Banner" />
        <div class="banner-text">
          <h2>
            Save our environment, step by step with this innovative eco-friendly
            app!
          </h2>
        </div>
      </div>

      <div class="banner promo">
        <div class="promo-info">
          <h3>The Body Shop</h3>
          <p>35% OFF - Valid until Dec 30, 2023</p>
        </div>
        <div class="promo-action">
          <button>Know More</button>
        </div>
      </div>

      <!-- Product Cards -->
      <div class="card-grid">
        <div class="card">
          <img src="img.2.jpg" alt="EcoHaven" />
          <div class="card-overlay">
            <h3>EcoHaven</h3>
            <p>Household Appliances</p>
          </div>
        </div>
        <div class="card">
          <img src="img.3" alt="Eco Store" />
          <div class="card-overlay">
            <h3>EcoCafe</h3>
            <p>Eco-friendly Cafe</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
